<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commit Diff Viewer - AGY Git Graph</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #181825;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .popout-header {
      background-color: #1e1e2e;
      border-bottom: 1px solid #313244;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .popout-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .popout-file-path {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-weight: bold;
      font-size: 14px;
      color: #89b4fa;
    }
    .popout-commit-meta {
      font-size: 12px;
      color: #9399b2;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .popout-hash-pill {
      background-color: #313244;
      color: #a6e3a1;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
    .popout-stats {
      font-family: monospace;
      font-size: 12px;
      margin-left: 10px;
    }
    .stat-add { color: #a6e3a1; font-weight: bold; }
    .stat-del { color: #f38ba8; font-weight: bold; }
    .popout-diff-container {
      flex: 1;
      overflow: auto;
      padding: 16px;
      background-color: #11111b;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .diff-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .diff-line {
      display: flex;
      white-space: pre-wrap;
      word-break: break-all;
      padding: 1px 4px;
      border-radius: 2px;
    }
    .diff-line:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }
    .diff-line-add {
      background-color: rgba(166, 227, 161, 0.12);
      color: #a6e3a1;
    }
    .diff-line-del {
      background-color: rgba(243, 139, 168, 0.12);
      color: #f38ba8;
    }
    .diff-line-hunk {
      background-color: rgba(137, 180, 250, 0.12);
      color: #89b4fa;
      font-weight: bold;
      margin: 4px 0;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header class="popout-header">
    <div class="popout-title-group">
      <span style="font-size: 16px;">📄</span>
      <span class="popout-file-path" id="p-file">載入中...</span>
      <span class="popout-stats" id="p-stats"></span>
    </div>
    <div class="popout-commit-meta">
      <span class="popout-hash-pill" id="p-hash"></span>
      <span id="p-author"></span>
      <span id="p-subject" style="max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
    </div>
  </header>

  <main class="popout-diff-container" id="p-content">
    <div style="color: #6c7086; padding: 20px; text-align: center;">載入 Diff 資料中...</div>
  </main>

  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const hash = params.get('hash');
      const file = params.get('file');
      const repo = params.get('repo');

      const pFile = document.getElementById('p-file');
      const pHash = document.getElementById('p-hash');
      const pAuthor = document.getElementById('p-author');
      const pSubject = document.getElementById('p-subject');
      const pStats = document.getElementById('p-stats');
      const pContent = document.getElementById('p-content');

      if (!hash || !file) {
        pFile.textContent = '錯誤：缺少 hash 或 file 參數';
        return;
      }

      pFile.textContent = file;
      pHash.textContent = hash === 'WORKING' ? 'WORKING' : hash.substring(0, 7);
      if (hash === 'WORKING') {
        pHash.style.backgroundColor = '#f9e2af';
        pHash.style.color = '#11111b';
      }

      const isWorking = hash === 'WORKING';
      const diffEndpoint = isWorking ? '/api/working-diff' : '/api/diff';
      const url = new URL(diffEndpoint, window.location.origin);
      if (!isWorking) url.searchParams.set('hash', hash);
      url.searchParams.set('file', file);
      if (repo) url.searchParams.set('repo', repo);

      try {
        let commitRes = { ok: false };
        if (isWorking) {
          pAuthor.textContent = 'Local Working Tree';
          pSubject.textContent = '· 未提交變更 (Uncommitted Changes)';
        } else {
          commitRes = await fetch(`/api/commit/${hash}${repo ? '?repo=' + encodeURIComponent(repo) : ''}`).then(r => r.json());
          if (commitRes.ok) {
            pAuthor.textContent = `${commitRes.author}`;
            pSubject.textContent = `· ${commitRes.subject}`;
            pSubject.title = commitRes.subject;
          }
        }

        const diffRes = await fetch(url.toString()).then(r => r.json());
        if (!diffRes.ok) throw new Error(diffRes.error || '無法載入 Diff');

        const lines = (diffRes.diff || '').split('\n');
        pContent.innerHTML = '';

        let addCount = 0;
        let delCount = 0;

        lines.forEach(line => {
          const div = document.createElement('div');
          div.className = 'diff-line';
          div.textContent = line;

          if (line.startsWith('+') && !line.startsWith('+++')) {
            div.classList.add('diff-line-add');
            addCount++;
          } else if (line.startsWith('-') && !line.startsWith('---')) {
            div.classList.add('diff-line-del');
            delCount++;
          } else if (line.startsWith('@@')) {
            div.classList.add('diff-line-hunk');
          }

          pContent.appendChild(div);
        });

        pStats.innerHTML = `<span class="stat-add">+${addCount}</span> <span class="stat-del">-${delCount}</span>`;

      } catch (err) {
        pContent.innerHTML = `<div style="color: #f38ba8; padding: 20px;">載入失敗: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
