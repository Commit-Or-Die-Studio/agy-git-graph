<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Graph - AGY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- 頂部工具列 (Toolbar) -->
    <header class="toolbar">
      <div class="toolbar-row top-row">
        <div class="repo-info">
          <span class="repo-icon">📂</span>
          <select id="project-select" class="project-dropdown" title="切換 AGY 專案">
            <option value="">載入專案中...</option>
          </select>
          <span class="branch-pill" id="current-branch-badge">HEAD</span>
        </div>
        <div class="toolbar-actions">
          <button id="btn-refresh" class="icon-btn" title="重新整理 (Refresh)">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
              <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
              <path d="M8 0.5v3l2.5-1.5L8 0.5z"/>
            </svg>
          </button>
          <button id="btn-toggle-repo" class="icon-btn" title="切換儲存庫路徑">⚙️</button>
        </div>
      </div>

      <!-- 切換儲存庫面板 (預設隱藏) -->
      <div id="repo-switch-bar" class="repo-switch-bar hidden">
        <input type="text" id="repo-path-input" placeholder="請輸入本機 Git 倉庫絕對路徑...">
        <button id="btn-set-repo" class="btn-primary">切換</button>
      </div>

      <!-- 篩選列 -->
      <div class="toolbar-row filter-row">
        <select id="branch-select" class="dropdown" title="篩選分支">
          <option value="all">🌿 所有分支 (All)</option>
        </select>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜尋 commit、作者、hash..." autocomplete="off">
          <button id="btn-clear-search" class="clear-btn hidden">&times;</button>
        </div>
      </div>
    </header>

    <!-- 狀態指示條 (例如 Working Tree 變更) -->
    <div id="status-bar" class="status-bar">
      <span id="working-tree-status">檢查中...</span>
      <span id="commits-count" class="commits-count">0 commits</span>
    </div>

    <!-- 主要視圖：分支圖與 Commit 列表 -->
    <main class="graph-scroll-container" id="graph-container">
      <div class="graph-table" id="graph-table">
        <!-- SVG 分支繪圖層 -->
        <svg id="graph-svg" class="graph-svg"></svg>
        
        <!-- Commit 條目列表 (與 SVG 節點同高 28px) -->
        <div id="commit-list" class="commit-list"></div>
      </div>

      <!-- 空白/載入中狀態 -->
      <div id="loading-state" class="state-overlay">
        <div class="spinner"></div>
        <p>載入 Git Commit 歷史中...</p>
      </div>
      <div id="empty-state" class="state-overlay hidden">
        <p>找不到符合條件的 Commit</p>
      </div>
    </main>

    <!-- 下方/側邊 Commit 詳情面板 (Drawer) -->
    <aside id="detail-drawer" class="detail-drawer hidden">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <span class="commit-hash-pill" id="detail-hash">-------</span>
          <span class="drawer-author" id="detail-author">Author</span>
        </div>
        <button id="btn-close-drawer" class="icon-btn" title="關閉">&times;</button>
      </div>

      <div class="drawer-body">
        <div class="detail-message-box">
          <div class="detail-subject" id="detail-subject">Commit Subject</div>
          <div class="detail-meta">
            <span id="detail-date">Date</span>
          </div>
          <pre class="detail-body-text hidden" id="detail-body-text"></pre>
        </div>

        <div class="files-section">
          <div class="files-header">
            <span>變更檔案 (<span id="detail-files-count">0</span>)</span>
          </div>
          <ul class="file-list" id="file-list"></ul>
        </div>

        <!-- 檔案 Diff 檢視區域 -->
        <div class="diff-section hidden" id="diff-section">
          <div class="diff-header">
            <span class="diff-filename" id="diff-filename">filename</span>
            <button id="btn-close-diff" class="icon-btn" title="收合 Diff">&times;</button>
          </div>
          <div class="diff-content" id="diff-content"></div>
        </div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
